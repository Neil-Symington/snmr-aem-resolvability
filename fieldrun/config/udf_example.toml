# udf_example.toml -- one control file for a batch field run.
#
#   ./run_batch.sh --config config/udf_example.toml
#
# Every parameter the five stages need lives here. Before this file they were
# spread across four places: constants in udf_system.jl, constants in
# ek_prerun/prerun_config.jl, argv in run_seven.sh, and literals inside the
# stage scripts. Two runs could differ in a way no log recorded.
#
# Paths are relative to this repository's fieldrun/ directory.

[run]
name   = "udf_example"
sites  = ["SMR_UD21", "SMR_UD24"]
stages = ["aem_occam", "aem_transd", "snmr_transd", "detect", "profile", "gate"]
mode   = "smoke"        # see the timings below; "full" for the real thing
#
# MEASURED, two sites, npar = 2, on a 31 GB 12-core machine:
#
#   aem_occam      ~4 min/site     snmr_transd   ~3 min/site (smoke)
#   aem_transd     ~2 min/site     detect        ~3 min total
#   profile        ~95 min total   gate          ~25 s total
#                                  ------------------------------
#                                  1 h 48 min end to end
#
# "smoke" does NOT make this quick, and that is worth knowing before you start
# it: smoke only shortens the two MCMC stages. `profile` is an Occam solve plus
# a lambda^2 sweep plus a bisection per band edge, with no Monte Carlo in it to
# shorten, so it costs the same in both modes and dominates either. A full run
# is roughly this plus 13 min/site of SNMR trans-D.

# MEMORY, measured on a 31 GB machine: one site is an AEM master plus tempered
# chains (~6 GB), then an SNMR master plus chains (~6.5 GB). Two concurrent is
# the ceiling; four exhausted RAM and swap and per-process CPU fell to 12-20%.
npar       = 2
minfree_gb = 7

[paths]
sites       = "example/sites.csv"
snmr_meta   = "example/snmr_metadata.csv"
snmr_dir    = "example/snmr"
aem_sounds  = "example/aem/soundings"
aem_nav     = "example/aem/nav_clip.parquet"
aem_system  = "example/aem/system/UDF_AEM_Data"   # .des/.dfn/.prj share this stem
outputs     = "outputs/udf_example"
logs        = "logs/udf_example"

[snmr]
# Vista Clara writes several products per site. The operator's preferred one is
# the most processed, so this is a preference order, not a filename.
mat_preference    = ["harmonic_removed_noemi", "noemi", "harmonic_removed", ""]
min_pulse_moments = 6        # fewer than this and the sounding is rejected
loop_shape        = "square"
# loop_side comes from snmr_metadata.csv coil_diameter (100 m here). The square
# forward takes the HALF-side, which is applied in code -- do not halve it here.

[aem]
# From AUS_10087_report.pdf p.33: "a nominal uncertainty of 3% was applied to
# each datum, as well as the calculated relative uncertainty as provided with
# the EM data", so sigma_i = |d_i| * sqrt(0.03^2 + RUNC_i^2).
nominal_unc  = 0.03
lm_gates     = [9, 26]
hm_gates     = [16, 38]
# The ramp MUST include the on-time. Dropping it makes late time over-predict
# by ~50% in conductive ground and is invisible in resistive ground.
lm_ramp_hold = 1.018e-3
hm_ramp_hold = 15.0e-3
lowpass_hz   = [203.6e3, 300.0e3]
tx_area_m2   = 342.0        # rTx = sqrt(area/pi) = 10.43 m
rx_radius_m  = 13.29
rx_dz_m      = -2.00
max_sep_m    = 200.0        # reject a site whose nearest sounding is further

# THE SNMR INVERSION GRID, and only that. A reviewer read this section against
# UDFSystem.build_grid()'s 334.4 m and reasonably concluded the two conflicted.
# They do not: they are different instruments.
#
#   SNMR, this section                      60 cells -> 147.4 m
#   AEM, UDFSystem.build_grid() defaults    70 cells -> 334.4 m
#   AEM, the synthetics (src/aem_setup.jl)  65 cells -> 281.6 m
#
# AEM sees deeper than SNMR, so its grid is deeper; GA Record 2024/29 caps SMR
# interpretation at about 90 m. These values match src/prerun_config.jl exactly,
# which is what puts the East Kimberley, Upper Darling and synthetic posteriors
# on one grid so the three can be compared without an apples-to-oranges caveat.
[grid]
nz         = 60
zstart     = 1.0
dz         = 1.0
extendfrac = 1.028          # zbnd[end] = 147.4 m, "bottom about 150 m"

[mcmc]
nchains    = 4
tmax       = 2.5            # log-spaced temperature ladder
# 150001, which is what the UDF production run used (recorded in its own
# output: udf_realdata/outputs/smr_transd_SMR_UD21.jld2 has nsamples = 150001).
# This file said 200001, a number with nothing behind it, so the shipped
# default did not reproduce the run the report's numbers come from.
nsamples   = 150001
burninfrac = 0.5
save_freq  = 10
# nensembles was here. It named the same quantity as [kernel] n_draws below --
# one kernel per ensemble -- with nothing reading either, and two keys for one
# quantity is how the s_prior_tau disagreement happened. [kernel] n_draws now.
seed_base  = 20260926       # per-sounding stream = seed_base + hash(site)
nmin       = 2
nmax       = 40
lambda_gp  = [3.0]          # GP correlation length, in depth cells
delta      = 1e-4
fbounds    = [0.001, 0.45]  # water content, v/v

[mcmc.smoke]
# What "mode = smoke" overrides. Exercises every stage and every file path in
# minutes; proves nothing about a posterior.
nsamples = 2001
nchains  = 2
kernel_draws = 1

[noise]
sigma_hat_branch = "fid_residual_per_q"
s_prior_center   = 1.0      # trust the per-pulse-moment sigma-hat level
# tau = 2.0, NOT the pre-run's 0.5. Measured (ek_prerun noise_floor.jl): the
# processed GMR records carry no recoverable noise, so sigma-hat from est_E0_T2
# is decay-model mismatch and gives a per-moment SHAPE but never a level. At
# tau = 0.5 the East Kimberley posterior s sat at chi2/N 2.90 against SSC's
# 1.02 -- the prior too narrow by about 1.7x in sigma. This file said 0.5 while
# run_smr_transd.jl hardcoded 2.0 and ignored the file; 2.0 is the value every
# run has actually used.
s_prior_tau      = 2.0      # log-normal width
s_sdev           = [0.3]    # Gaussian random walk in ln s
# s in [1e-2, 1e4], stated as log10 and converted to natural log in the stage.
# This file said [-2, 2]; the stage ran [-2, 4] and the upper bound is not
# academic -- the posterior s runs into the tens, so 1e2 would pin it.
s_bounds_log10   = [-2.0, 4.0]

[kernel]
# The SNMR kernel is a function of sigma(z), so AEM conductivity uncertainty
# propagates into it. Each draw gives a different kernel and the pooled
# posterior marginalises over them rather than conditioning on one.
#
# This matters more at UDF than at East Kimberley: the trans-D AEM pins
# conductance to about +/-15% but POINTWISE conductivity at 20-80 m only to a
# factor of 4-64, because the response saturates over a thick conductor.
n_draws = 4

[occam]
regtype     = "R2"
w0          = 0.02          # uniform start and reference model
lam2_log10  = [-1.0, 6.0]
beta2       = 0.01
uncertainty = "laplace"     # linearised Cm; bootstrap not run

[detect]
theta             = 0.10    # v/v
min_thick_m       = 5.0
occam_chi2_max    = 1.5
doi_widthfrac     = 0.6     # primary
doi_widthfrac_alt = [0.5, 0.7]
# Integrals, not thresholds. The window integral of theta is far better
# determined than pointwise theta, and iso-water threshold pairs can move the
# detection probability from 0.04 to 0.78 on the same data.
metric = "integral"

[gate]
thresholds_mgL = [1000, 1500, 3000]

[convergence]
# Reported per site; a run that fails these is not quotable.
rhat          = 1.05
min_ess       = 100
splithalf_dw  = 0.03        # v/v agreement between split halves
splithalf_max = 0.20        # |median shift| / p10-p90 width; above this, not converged
trend_sigma   = 2.0         # misfit-trace stationarity tolerance
depths_m      = [5.0, 15.0, 30.0, 60.0, 100.0]
