name = "confined_aquifer_v2"
description = """
Fresh sand aquifer confined between a clay cap and a clay aquitard, with a
brackish sand aquifer beneath. Riverine Plain (Murray Basin) analogue.
The target is a resistive unit enclosed by conductors — the hard case for
inferring salinity from conductivity.
"""

[grid]
dz   = 0.25        # fine grid spacing (m)
zmax = 200.0       # bottom of the model (m)

[petrophysics]
p_clay     = 1.5   # exponent in theta_SMR = phi*S*(1-clay)^p_clay
m_archie   = 1.7   # cementation exponent in sigma_w * theta^m
sigma_clay = 0.5   # SECTION DEFAULT only, for units naming neither a mineral
                   # nor a lithology. Surface conduction is per unit: set
                   # `clay_mineral` (kaolinite / illite / smectite / mixed) or
                   # `sigma_clay` on each unit instead. One value for a whole
                   # section gives a clean kaolinitic sand the same surface
                   # conduction as a smectitic clay — about 10x wrong.

# SNMR acquisition. These are written into the truth file and read by the
# inversion stages, so stating them here keeps nothing implicit -- without this
# block the defaults apply and LOOP_SIDE in particular silently becomes 88.6.
[smr]
loop_side       = 100.0     # m, square loop; the forward takes the HALF-side
Be_nT           = 58000.0   # Earth field magnitude -> Larmor 2469.5 Hz
inclination_deg = -66.5     # southern hemisphere

[variability]
# Test one's variability, verbatim (paper_3P.toml), on Neil's ruling of
# 21 Nov 2026. The v1 column states corr_length 6.0, log_sd_phi 0.10 and
# log_sd_clay 0.15 -- the generator's own defaults -- and omits log_sd_sigma_w
# and jitter, so its pore water is flat and its fractions are perturbed in log
# space. Measured on the truth, v1 is 12-16x smoother per cell than test one,
# which confounds any comparison of resolvability between the two grounds.
# Everything else in this file is unchanged from v1: the same units, depths,
# water and window (17.5-33.5 m).
jitter          = "logit"
seed            = 20261012
corr_length     = 1.0
log_sd_phi      = 0.35
log_sd_clay     = 0.45
log_sd_sigma_w  = 0.25
transition_min  = 3.0
transition_max  = 6.0

[[unit]]
top = 0.0
name = "Shepparton Fm, unsaturated"
clay_mineral = "mixed"   # Riverine Plain cracking clay; smectite-bearing but
                         # mixed-layer — pure smectite (2.0 S/m) would put this
                         # unit near 0.9 S/m, well above what the basin shows
phi = 0.33
S = 1.0
clay = 0.40
sigma_w = 0.05

[[unit]]
top = 4.0
name = "Shepparton Fm, clay cap"
clay_mineral = "mixed"   # floodplain clay, high activity
phi = 0.35
S = 1.0
clay = 0.45
sigma_w = 0.05

[[unit]]
top = 18.0
name = "Calivil Fm — AQUIFER 1"
clay_mineral = "kaolinite"   # highland-derived quartz sand and gravel
phi = 0.30
S = 1.0
clay = 0.08
sigma_w = 0.08          # fresh, ~520 mg/L

[[unit]]
top = 34.0
name = "clay aquitard — CONFINING"
clay_mineral = "mixed"   # lacustrine-floodplain clay
phi = 0.42
S = 1.0
clay = 0.65
sigma_w = 0.30

[[unit]]
top = 46.0
name = "Renmark Gp — AQUIFER 2"
clay_mineral = "kaolinite"   # fluvial sand, some lignite
phi = 0.28
S = 1.0
clay = 0.10
sigma_w = 0.60          # brackish, ~3,800 mg/L

[[unit]]
top = 62.0
name = "weathered Palaeozoic"
clay_mineral = "kaolinite"   # saprolite on a weathered granitic terrain
phi = 0.12
S = 1.0
clay = 0.30
sigma_w = 1.00

[[unit]]
top = 78.0
name = "saprock"
clay_mineral = "kaolinite"
phi = 0.06
S = 1.0
clay = 0.12
sigma_w = 1.20

[[unit]]
top = 85.0
name = "unweathered Palaeozoic"
clay_mineral = "kaolinite"
phi = 0.02
S = 1.0
clay = 0.03
sigma_w = 1.50
