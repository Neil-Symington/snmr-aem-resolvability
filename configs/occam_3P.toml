# ---------------------------------------------------------------------
#  occam_3P.toml  (generated by occam_test/make_occam_inputs.jl)  --  synthetic column 3P
#  test one, unconfined Loxton-Parilla sands, tier P
#  Role: primary   Priority: primary
# ---------------------------------------------------------------------
# Inherits every key, and every explanatory comment, from ../config.toml.
# Only what differs for this column is restated here, so a reviewer can
# see the whole difference between two columns on one screen.
extends = "../config.toml"

name  = "occam_3P"
label = "test one, unconfined Loxton-Parilla sands, tier P"

[data]
truth  = "data/truth_murray3P.jld2"
column = "3P"
parent = ""             # a primary column, not derived
role   = "primary"
snmr_ensemble = "data/cond_C2_occam3P.jld2"
# NOT aem_draws_3P: the Stage 1 AEM run for this column is tagged 3M.
# truth_murray3M and truth_murray3P have IDENTICAL sigma_bulk, clay, sigma_w
# and phi and differ only in theta_SMR, and Stage 1 sees only sigma_bulk,
# so the 3M draws are this column's draws. The saline and water-table
# variants use their own tags, which makes this one look like a typo. It is
# not, and a review lost time to it.
stage1_draws = "data/aem_draws_occam3P.jld2"

[data.loop]
side       = 100.0
area_check = 10000.0

[data.snmr]
noise_tier = "typical"

[output]
dir = "outputs/occam_3P"
