[low_moment]
# gate centre times, s, measured from current switch-off
times = [2.07898052e-05, 2.62677749e-05, 3.31999398e-05, 4.21442285e-05, 5.35474182e-05, 6.79706260e-05, 8.58592220e-05, 1.08219943e-04, 1.36059127e-04, 1.71276052e-04, 2.16443101e-04, 2.73129101e-04, 3.44568043e-04, 4.35018351e-04, 5.48274727e-04, 6.91268404e-04, 8.71607404e-04]
