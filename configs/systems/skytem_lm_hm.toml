# ---------------------------------------------------------------------
#  skytem_lm_hm.toml  --  SkyTEM dual-moment system description
# ---------------------------------------------------------------------
# Exported verbatim from HiQGA`s `examples/SkyTEM1D/synth/McMC/
# electronics_halt.jl`, the AusAEM-realistic electronics-halt pattern this
# project has used throughout. Exported rather than referenced so the
# repository runs without HiQGA`s examples tree on disk.
#
# THE ON-TIME RAMP IS INCLUDED AND MUST STAY INCLUDED. The waveform tables
# below carry rows at NEGATIVE time: 6 for the low moment, 4 for the high.
# Those rows are the transmitter current rising before switch-off. Drop
# them and modelled late-time amplitudes over-predict by about 50 percent
# in conductive ground, with NO signature in the misfit -- the error is
# smooth, so the inversion absorbs it into conductivity. In resistive
# ground it is nearly invisible, which is how the mistake survives review.
# `require_on_time` below is asserted at load.
#
# Units: times s, ramp current normalised to 1 at full current,
# lengths m, noise in the same units as the data (1e-12 V/Am^4, i.e. the
# `units = 1e-12` passed to makenoisydata!).

name = "SkyTEM dual-moment, AusAEM electronics_halt"
source = "HiQGA examples/SkyTEM1D/synth/McMC/electronics_halt.jl"
require_on_time = true      # assert both ramps carry rows at t < 0

[geometry]
r_tx  = 10.4               # m, transmitter loop radius
r_rx  = 13.0                # m, receiver offset from the transmitter centre
z_tx  = -40.0               # m, transmitter height (negative = above ground)
z_rx  = -42.0               # m, receiver height
# Sign convention: z is positive DOWN with 0 at ground level, so the
# airborne system sits at negative z.

[filters]
lowpass_fc = [3.00000000e+05, 4.50000000e+05]   # Hz, receiver low-pass corner frequencies

