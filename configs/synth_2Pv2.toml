role   = "primary"
snmr_ensemble = "data/stage2/2Pv2T_pooled_20261122-173135/cond_C2_typical2Pv2T.jld2"
# Stage 1 has not run for this column yet; set after it does.
stage1_draws = ""

[data.loop]
side       = 100.0
area_check = 10000.0

[data.snmr]
noise_tier = "typical"

[output]
dir = "outputs/synth_2Pv2"
