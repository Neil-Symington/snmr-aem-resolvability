# ---------------------------------------------------------------------
#  synth_2S.toml  --  synthetic column 2S
#  test two saline control, water-only change from 2P
#  Role: saline_control   Priority: control
# ---------------------------------------------------------------------
# Inherits every key, and every explanatory comment, from ../config.toml.
# Only what differs for this column is restated here, so a reviewer can
# see the whole difference between two columns on one screen.
extends = "../config.toml"

name  = "synth_2S"
label = "test two saline control, water-only change from 2P"

[data]
truth  = "data/truth_murray2S.jld2"
column = "2S"
parent = "2P"           # built from truth_murray2P.jld2
role   = "saline_control"
snmr_ensemble = "data/stage2/2ST_pooled_20261118-121816/cond_C2_typical2ST.jld2"   # eight-ensemble pooled run, 18 Nov; per-run folder (see DECISIONS.md)
stage1_draws = "data/aem_draws_2S.jld2"

[data.loop]
side       = 100.0
area_check = 10000.0

[data.snmr]
noise_tier = "typical"

[output]
dir = "outputs/synth_2S"
