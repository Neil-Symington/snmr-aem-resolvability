# ---------------------------------------------------------------------
#  synth_2SJ.toml  --  synthetic column 2S, AEM + galvanic sounding
#  test two saline control, joint Stage 1
#  Role: saline_control   Priority: control
# ---------------------------------------------------------------------
# The SAME column and the SAME AEM data as synth_2S.toml. The only change is
# that Stage 1 saw a Schlumberger sounding as well, so every difference in
# Stages 2-5 is attributable to the sounding and to nothing else.
#
# Stage 2 runs on the JOINT median kernel: run_conditions.jl builds the SNMR
# kernel from aem<TAG>/aem_posterior.jld2, and joint_post.jl writes the joint
# percentiles to aem2SJ/ so that lookup finds the joint column.
extends = "../config.toml"

name  = "synth_2SJ"
label = "test two saline control, AEM + galvanic sounding, tier P"

[data]
truth  = "data/truth_murray2S.jld2"
column = "2S"
parent = "2P"           # built from truth_murray2P.jld2
role   = "saline_control"
snmr_ensemble = "data/cond_C2_typical2SJT.jld2"
stage1_draws  = "data/aem_draws_2SJ.jld2"

[data.dc]
enabled = true
# array, spacings, noise, seed and forward are all inherited from config.toml;
# the realisation itself is in dc_sounding_2S.jld2.

[data.loop]
side       = 100.0
area_check = 10000.0

[data.snmr]
noise_tier = "typical"

[output]
dir = "outputs/synth_2SJ"
