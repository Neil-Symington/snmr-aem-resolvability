# ---------------------------------------------------------------------
#  occam_2P.toml  (generated by occam_test/make_occam_inputs.jl)  --  synthetic column 2P
#  test two, confined Calivil/Renmark aquifers, tier P
#  Role: primary   Priority: primary
# ---------------------------------------------------------------------
# Inherits every key, and every explanatory comment, from ../config.toml.
# Only what differs for this column is restated here, so a reviewer can
# see the whole difference between two columns on one screen.
extends = "../config.toml"

name  = "occam_2P"
label = "test two, confined Calivil/Renmark aquifers, tier P"

[data]
truth  = "data/truth_murray2P.jld2"
column = "2P"
parent = ""             # a primary column, not derived
role   = "primary"
snmr_ensemble = "data/cond_C2_occam2P.jld2"
# NOT aem_draws_2P: the Stage 1 AEM run for this column is tagged 2M.
# truth_murray2M and truth_murray2P have IDENTICAL sigma_bulk, clay, sigma_w
# and phi and differ only in theta_SMR, and Stage 1 sees only sigma_bulk,
# so the 2M draws are this column's draws. The saline and water-table
# variants use their own tags, which makes this one look like a typo. It is
# not, and a review lost time to it.
stage1_draws = "data/aem_draws_occam2P.jld2"

[data.loop]
side       = 100.0
area_check = 10000.0

[data.snmr]
noise_tier = "typical"

[output]
dir = "outputs/occam_2P"
