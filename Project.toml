# A plain environment, not a package: these are scripts, and declaring a
# name/uuid here made Julia look for src/SNMRAEMResolvability.jl and warn
# that it was missing on every instantiate.
#
# NOTE: `Pkg.add` rewrites this file and DROPS every comment in it. It has now
# done so twice -- once adding the stdlibs on consolidation, once adding MAT for
# the field workflow. If you add a dependency, put these back.
#
# MAT reads the Vista Clara .mat files the field SNMR stages invert. It pulls
# HDF5 and about 180 Manifest lines with it, so any install evidence from before
# it was added does not cover the current environment.
[deps]
Conda = "8f4d0f93-b110-5947-807f-2305c1781a2d"
HiQGA = "01574e87-63b6-4466-925a-334cf7e21b6b"
JLD2 = "033835bb-8acc-5ee8-8aae-3f567f8a3819"
LinearAlgebra = "37e2e46d-f89d-539d-b4ee-838fcccc9c8e"
MAT = "23992714-dd62-5051-b70f-ba57cb901cac"
Printf = "de0858da-6303-5e67-8744-51eddeeeb8d7"
PyPlot = "d330b81b-6aea-500a-939a-2ce795aea3ee"
Random = "9a3f8284-a2c9-5f02-9a11-845980a1fd5c"
SMRPInversion = "aec56ffe-cd48-4f37-83c0-3fddfef137dd"
SNMRForward = "7a571783-2426-4210-b64c-8cc94fde9200"
Statistics = "10745b16-79ce-11e8-11f9-7d13ad32a3b2"
TOML = "fa267f1f-6049-4f14-aa54-33bafae1ed76"

# SMRPInversion is not registered, and the runs used a BRANCH of it, not main:
# add-occam-deterministic-inversion carries the hierarchical heteroscedastic
# noise model and the Occam bootstrap that every result here depends on.
# Installing main instead silently reproduces different numbers, so the branch
# and the commit are pinned here rather than left to a README instruction.
#
# RESTORED 11 Nov 2026. `Pkg.add` had dropped this block and the [compat] one
# below when MAT was added, and the NOTE at the top of this file says to put
# them back. They were not put back, so the branch carried a pin with no stated
# reason and merging it into main would have deleted the reason from main too.
[sources]
SMRPInversion = {rev = "add-occam-deterministic-inversion", url = "https://github.com/Neil-Symington/SMRPInversion.jl"}

[compat]
# The 1.12 SERIES, not 1.12-or-newer. Below it the pinned Manifest resolves
# PrecompileTools 1.3.4, whose src/invalidations.jl needs Base.ReinferUtils or
# Base.StaticData, and neither exists before 1.12; an independent review hit
# that on 1.11.7, where install.jl fails at step 2. Above it, setup is reported
# to fail on 1.13 (12 Nov 2026), which is unsurprising: this Manifest is
# machine-generated, declares julia_version = "1.12.6", and pins stdlib
# versions from that series.
#
# `~1.12` is [1.12.0, 1.13.0). This is ADVISORY -- Pkg warns for the active
# project and carries on -- so install.jl enforces the range itself, and it
# used to enforce only the floor.
julia = "~1.12"
