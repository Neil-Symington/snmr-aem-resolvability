# CI: the platform coverage three manual review rounds could not provide.
#
# Every manual round ran on Ubuntu x86_64 and Julia 1.12.6 only, so macOS and
# every other 1.12 patch were untested, and the conda PATH workaround in
# install.jl is Debian-and-Ubuntu-specific. This runs the real install, not a
# shortcut.
#
# COVERAGE, stated precisely: macos-latest is Apple Silicon, so macOS on ARM is
# covered here. What is NOT covered is Linux on ARM, macOS on Intel, and
# Windows. An earlier version of this comment called ARM a gap, which a review
# corrected.
#
# Determinism is checked BY VALUE, never by file hash: a truth .jld2 embeds the
# Julia version string and a serialised Dict, so its SHA-256 differs between
# machines and between Julia patch versions while every number is identical.
# Comparing hashes here would fail for the wrong reason.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  install-and-test:
    name: ${{ matrix.os }} / Julia ${{ matrix.julia }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        julia: ['1.12', '1.12.6']
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia }}

      # No depot cache on purpose. The defect this guards is a FIRST install
      # from an empty depot, which is the only state in which the HiQGA/conda
      # build failure appears; a warm cache would hide it.
      - name: install.jl from an empty depot
        run: julia --project=. install.jl

      # `git diff --exit-code` alone passes when the file is DELETED in the
      # commit or untracked, which a review pointed out, so existence is
      # asserted first and tracking second.
      - name: the tracked Manifest must exist and be unmodified
        run: |
          test -f Manifest.toml || { echo "Manifest.toml is missing"; exit 1; }
          git ls-files --error-unmatch Manifest.toml >/dev/null \
            || { echo "Manifest.toml is not tracked"; exit 1; }
          git diff --exit-code -- Manifest.toml Project.toml

      - name: tests
        run: julia --project=. test/runtests.jl

      - name: build a truth column
        run: julia --project=. synthetics/scripts/build_truth.jl synthetics/config/confined_aquifer.toml

      - name: forward-model it
        run: julia --project=. synthetics/scripts/forward.jl synthetics/output/confined_aquifer_truth.jld2

      - name: examples
        run: |
          julia --project=. synthetics/examples/01_hello_column.jl
          julia --project=. synthetics/examples/02_build_in_code.jl
          julia --project=. synthetics/examples/03_why_clay_matters.jl

      - name: dry run
        run: julia --project=. run_site.jl configs/synth_2P.toml --dry-run

  reject-old-julia:
    name: install.jl refuses Julia 1.11
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'
      # [compat] julia = "1.12" does NOT enforce anything -- Pkg warns for the
      # active project and carries on, which is how 1.11 stayed broken through
      # two review rounds. install.jl refuses at step 0, and this asserts it.
      # Inverting the exit status is not enough: a review deleted the gate and
      # this job still passed, because install.jl failed anyway -- 4m11s later,
      # inside PrecompileTools. So assert the GATE's own message, and assert it
      # happened fast enough to have come from step 0 rather than from the
      # failure it is meant to prevent.
      - name: must refuse at step 0, with the gate's own message
        run: |
          start=$(date +%s)
          set +e
          out=$(julia --project=. install.jl 2>&1); rc=$?
          set -e
          elapsed=$(( $(date +%s) - start ))
          echo "$out"
          echo "--- exit $rc after ${elapsed}s"
          if [ "$rc" -eq 0 ]; then
            echo "FAIL: install.jl accepted Julia 1.11"; exit 1
          fi
          echo "$out" | grep -q "needs Julia 1.12 or newer" || {
            echo "FAIL: exited non-zero but not from the version gate"; exit 1; }
          if [ "$elapsed" -gt 60 ]; then
            echo "FAIL: took ${elapsed}s, so it did not stop at step 0"; exit 1
          fi
          echo "refused at step 0, as intended"

  conda-workaround:
    # THE JOB THAT NOW TESTS WHAT IT CLAIMS. Two earlier versions did not.
    #
    # The failure install.jl works around is a PATH-LENGTH effect, not an
    # operating-system one: conda writes `#!/usr/bin/env python` as its
    # launcher's shebang when the absolute path to its own python would exceed
    # conda's 127-character limit, and `env` then resolves `python` through
    # PATH. A runner's default depot python path is about 49 characters, so it
    # gets an absolute shebang and can NEVER trigger the failure -- which is
    # why the first version of this job reported "no workaround needed", and
    # why the second version's "remove every python from PATH" step tested
    # nothing at all: a short path never consults PATH.
    #
    # An independent review measured the boundary at 125 characters (absolute,
    # works) versus 126 (env python, fails). So this job forces a long depot
    # and the failure becomes real.
    name: install.jl handles a long depot path
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - name: a depot path long enough to trigger the env-python shebang
        run: |
          deep="$HOME/$(printf 'depot_padding_%.0s' {1..8})d"
          mkdir -p "$deep"
          echo "JULIA_DEPOT_PATH=$deep" >> "$GITHUB_ENV"
          echo "depot path is ${#deep} characters: $deep"
          if [ ${#deep} -lt 100 ]; then
            echo "FAIL: too short to trigger the failure this job exists to test"
            exit 1
          fi
      # A review showed the previous version proved only the ABSENCE of one
      # string: any exception inside install.jl's try prints "as expected", so a
      # renamed message or an unrelated failure passed the job. It also ran
      # under `bash -e` with `out=$(julia ...)`, so a hard failure aborted the
      # step BEFORE the echo and the log never said why.
      #
      # So: tee the output as it happens (nothing is lost if it dies), and probe
      # the CAUSE directly -- conda's launcher shebang -- rather than inferring
      # it from a message.
      - name: install.jl must hit the conda failure AND recover from it
        run: |
          set +e
          echo "depot: $JULIA_DEPOT_PATH (${#JULIA_DEPOT_PATH} chars)"
          julia --project=. install.jl 2>&1 | tee install.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "--- install.jl exit $rc"

          # 1. the direct evidence: conda wrote an env-python shebang, which is
          #    the failure's actual mechanism and not a message about it
          launcher=$(find "$JULIA_DEPOT_PATH" -path '*/conda/*/bin/conda' -type f 2>/dev/null | head -1)
          if [ -z "$launcher" ]; then
            echo "FAIL: no conda launcher found under the depot; cannot verify the cause"
            exit 1
          fi
          shebang=$(head -1 "$launcher")
          pypath="$(dirname "$launcher")/python"
          echo "launcher shebang : $shebang"
          echo "python path      : ${#pypath} characters"
          case "$shebang" in
            *"/usr/bin/env python"*)
              echo "the long path produced an env-python shebang, as intended" ;;
            *)
              echo "FAIL: shebang is absolute, so the conda failure CANNOT have"
              echo "      occurred and the workaround is untested. Either the"
              echo "      depot is too short (${#pypath} chars) or conda changed"
              echo "      its rule."
              exit 1 ;;
          esac

          # 2. and the install still has to have finished
          grep -q "environment ready" install.log || {
            echo "FAIL: install did not finish; the log above says why"; exit 1; }
          [ "$rc" -eq 0 ] || { echo "FAIL: install.jl exited $rc"; exit 1; }
          echo "the conda failure occurred and the workaround handled it"
      - name: keep the install log even when the step above fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conda-workaround-install-log
          path: install.log
          if-no-files-found: warn
      - name: tests
        run: julia --project=. test/runtests.jl
